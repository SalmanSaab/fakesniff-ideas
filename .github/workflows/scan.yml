name: collect ideas material

on:
  schedule:
    - cron: "0 7 * * *"      # every day, 7am UTC
  workflow_dispatch:          # and a button to run it by hand

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan and push to supabase
        run: python scan_cloud.py
